<svg
  width="640"
  height="480"
  viewBox="0 0 640 480"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Карточки действий</title>
  <desc id="desc">Пять карточек действий: 飞, 跑, 跳, 拍手, 数</desc>
  <rect width="640" height="480" rx="32" fill="#F0FDF4" />
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect
      x="52"
      y="80"
      width="156"
      height="128"
      rx="22"
      fill="#FFFFFF"
      stroke="#16A34A"
      stroke-width="5"
    />
    <text x="130" y="148" text-anchor="middle" font-size="52" fill="#14532D">
      飞
    </text>
    <text x="130" y="182" text-anchor="middle" font-size="18" fill="#166534">
      летать
    </text>
    <rect
      x="242"
      y="80"
      width="156"
      height="128"
      rx="22"
      fill="#FFFFFF"
      stroke="#0EA5E9"
      stroke-width="5"
    />
    <text x="320" y="148" text-anchor="middle" font-size="52" fill="#075985">
      跑
    </text>
    <text x="320" y="182" text-anchor="middle" font-size="18" fill="#0369A1">
      бежать
    </text>
    <rect
      x="432"
      y="80"
      width="156"
      height="128"
      rx="22"
      fill="#FFFFFF"
      stroke="#F59E0B"
      stroke-width="5"
    />
    <text x="510" y="148" text-anchor="middle" font-size="52" fill="#92400E">
      跳
    </text>
    <text x="510" y="182" text-anchor="middle" font-size="18" fill="#B45309">
      прыгать
    </text>
    <rect
      x="146"
      y="264"
      width="156"
      height="128"
      rx="22"
      fill="#FFFFFF"
      stroke="#EC4899"
      stroke-width="5"
    />
    <text x="224" y="332" text-anchor="middle" font-size="46" fill="#9D174D">
      拍手
    </text>
    <text x="224" y="366" text-anchor="middle" font-size="18" fill="#BE185D">
      хлопать
    </text>
    <rect
      x="338"
      y="264"
      width="156"
      height="128"
      rx="22"
      fill="#FFFFFF"
      stroke="#8B5CF6"
      stroke-width="5"
    />
    <text x="416" y="332" text-anchor="middle" font-size="52" fill="#5B21B6">
      数
    </text>
    <text x="416" y="366" text-anchor="middle" font-size="18" fill="#6D28D9">
      считать
    </text>
  </g>
</svg>
